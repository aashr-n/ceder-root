# Checks the bank on every pull request and on main: its format, its tools, that it builds, the plans, the source
# catalogue, the library and the routing table.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/validate.mjs --require-verified
      - run: npm test
      - run: node tools/build.mjs
      - name: Check every plan
        run: |
          status=0
          for plan in plan/*.json; do node tools/plan.mjs check "$plan" || status=1; done
          exit $status
      - run: node tools/plan.mjs overview --check
      - run: node sources/validate.mjs
      - run: node sources/validate.mjs sources/set-aside
      - run: node tools/library.mjs validate
      - run: node tools/library.mjs build
      - run: node tools/routes.mjs build
