# Checks the bank on every pull request and on main: its format, its tools, and that it builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tools/validate.mjs
      - run: npm test
      - run: node tools/build.mjs
