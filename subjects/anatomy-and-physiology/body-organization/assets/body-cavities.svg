<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" rx="44" fill="#FBF8F1"/>
  <!-- upper limb at the front -->
  <rect x="730" y="340" width="56" height="270" rx="28" fill="#E9E2D0" stroke="#1D2A24" stroke-width="5"/>
  <!-- legs -->
  <rect x="455" y="690" width="105" height="170" rx="42" fill="#E9E2D0" stroke="#1D2A24" stroke-width="5"/>
  <rect x="600" y="690" width="105" height="170" rx="42" fill="#E9E2D0" stroke="#1D2A24" stroke-width="5"/>
  <!-- abdominopelvic cavity, drawn first so the thoracic cavity sits on top -->
  <rect x="430" y="470" width="290" height="230" rx="50" fill="#7A99B3" stroke="#1D2A24" stroke-width="5"/>
  <!-- thoracic cavity -->
  <rect x="430" y="330" width="290" height="170" rx="60" fill="#B8C99E" stroke="#1D2A24" stroke-width="5"/>
  <!-- diaphragm -->
  <path d="M430,500 Q575,468 720,500" fill="none" stroke="#BA9957" stroke-width="12" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="524" y="262" width="72" height="80" fill="#F2C091" stroke="#1D2A24" stroke-width="5"/>
  <!-- cranial cavity -->
  <circle cx="560" cy="170" r="110" fill="#F2C091" stroke="#1D2A24" stroke-width="5"/>
  <!-- spinal cavity: a strip down the back -->
  <rect x="392" y="200" width="34" height="480" rx="17" fill="#C96E52" stroke="#1D2A24" stroke-width="4"/>
</svg>
